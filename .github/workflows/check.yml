name: Check extension

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    outputs:
      version:
        description: Checked extension version
        value: ${{ jobs.check.outputs.version }}
      filename:
        description: Packaged VSIX filename
        value: ${{ jobs.check.outputs.filename }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref_type != 'tag' }}
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      filename: ${{ steps.metadata.outputs.filename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Check version and prepare release notes
        id: metadata
        run: node scripts/release-metadata.mjs
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Package the tested source
        env:
          VSIX: ${{ steps.metadata.outputs.filename }}
        run: |
          npm run package -- --out "dist/$VSIX" \
            --baseContentUrl "https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA" \
            --baseImagesUrl "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA"
          cd dist
          sha256sum "$VSIX" > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ff-git-image-vsix
          path: |
            dist/*.vsix
            dist/SHA256SUMS
            dist/release-notes.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
